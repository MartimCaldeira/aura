<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0a0a0f;
  --surface:  #12121a;
  --surface2: #1a1a26;
  --gold:     #c8a96e;
  --gold2:    #dfc089;
  --text:     #f0f0f0;
  --muted:    #707070;
  --border:   rgba(200, 169, 110, 0.12);
  --red:      #e05555;
}

body {
  font-family: 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
}

/* ─── LOGIN OVERLAY ────────────────────────────────────── */
#login-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 48px 40px;
  width: 360px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.login-logo {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--gold);
  text-align: center;
}

.login-sub {
  font-size: 0.82rem;
  color: var(--muted);
  text-align: center;
  margin-top: -18px;
}

.login-card form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.login-card input[type="password"] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
  padding: 12px 16px;
  outline: none;
  transition: border-color 0.2s;
}
.login-card input[type="password"]:focus { border-color: var(--gold); }

#pw-error {
  font-size: 0.78rem;
  color: var(--red);
  min-height: 16px;
}

.btn-login {
  background: var(--gold);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  padding: 13px;
  cursor: pointer;
  transition: background 0.2s;
  letter-spacing: 0.04em;
}
.btn-login:hover { background: var(--gold2); }

/* ─── MAIN PANEL ───────────────────────────────────────── */
#panel { display: none; min-height: 100dvh; flex-direction: column; }
#panel.visible { display: flex; }

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-logo {
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--gold);
}
.header-logo span {
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 0.05em;
  font-size: 0.78rem;
  margin-left: 8px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 16px;
}

.link-player {
  font-size: 0.8rem;
  color: var(--muted);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: color 0.2s;
}
.link-player:hover { color: var(--gold); }

.btn-logout {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: inherit;
  font-size: 0.78rem;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
.btn-logout:hover { border-color: var(--red); color: var(--red); }

/* ─── MAIN CONTENT ─────────────────────────────────────── */
main {
  flex: 1;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  padding: 40px 24px 60px;
  display: flex;
  flex-direction: column;
  gap: 48px;
}

/* ─── UPLOAD ZONE ──────────────────────────────────────── */
.section-title {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 16px;
}

#drop-zone {
  border: 2px dashed rgba(200,169,110,0.35);
  border-radius: 14px;
  padding: 48px 32px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
#drop-zone:hover,
#drop-zone.dragover {
  border-color: var(--gold);
  background: rgba(200,169,110,0.04);
}

.dz-icon { color: rgba(200,169,110,0.5); }
#drop-zone:hover .dz-icon,
#drop-zone.dragover .dz-icon { color: var(--gold); }

.dz-text {
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text);
}
.dz-sub {
  font-size: 0.78rem;
  color: var(--muted);
}

/* ─── UPLOAD PROGRESS ──────────────────────────────────── */
#upload-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
}
#upload-list:empty { display: none; }

.pi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.pi-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.pi-name {
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.pi-status {
  font-size: 0.75rem;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.pi.success .pi-status { color: #5cb85c; }
.pi.error   .pi-status { color: var(--red); }

.pi-bar-wrap {
  height: 3px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
}
.pi-bar {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  width: 0%;
  transition: width 0.3s ease;
}
.pi.success .pi-bar { background: #5cb85c; }
.pi.error   .pi-bar { background: var(--red); }

#btn-clear-list {
  align-self: flex-start;
  background: none;
  border: none;
  font-family: inherit;
  font-size: 0.75rem;
  color: var(--muted);
  cursor: pointer;
  padding: 4px 0;
  transition: color 0.2s;
  display: none;
}
#btn-clear-list:hover { color: var(--text); }
#btn-clear-list.visible { display: inline; }

/* ─── TRACKS TABLE ─────────────────────────────────────── */
.tracks-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
#track-count {
  font-size: 0.75rem;
  color: var(--muted);
}

.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
}
th {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: left;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
td {
  padding: 10px 16px;
  font-size: 0.82rem;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.015); }

.td-cover { width: 56px; }
.td-dur   { width: 60px; color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
.td-order { width: 72px; }
.td-del   { width: 80px; text-align: right; }
.td-title { font-weight: 600; }
.td-artist{ color: var(--muted); font-size: 0.78rem; }

.track-thumb {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  object-fit: cover;
  display: block;
}
.thumb-ph {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.thumb-ph svg { opacity: 0.25; }

.btn-move {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.8rem;
  width: 26px;
  height: 26px;
  border-radius: 5px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
  padding: 0;
}
.btn-move:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
.btn-move:disabled { opacity: 0.25; cursor: default; }
.btn-move + .btn-move { margin-left: 4px; }

.btn-del {
  background: none;
  border: 1px solid rgba(224,85,85,0.3);
  color: var(--red);
  font-family: inherit;
  font-size: 0.75rem;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.btn-del:hover { background: rgba(224,85,85,0.12); border-color: var(--red); }

.empty-row td {
  text-align: center;
  color: var(--muted);
  padding: 36px 16px;
  font-size: 0.82rem;
}

#table-loading {
  text-align: center;
  padding: 32px;
  color: var(--muted);
  font-size: 0.82rem;
}
</style>
</head>
<body>

<!-- ── LOGIN OVERLAY ──────────────────────────────────── -->
<div id="login-overlay">
  <div class="login-card">
    <div class="login-logo">AURA</div>
    <p class="login-sub">Painel de Administração</p>
    <form id="login-form">
      <input type="password" id="pw-input" placeholder="Password" autocomplete="current-password">
      <p id="pw-error"></p>
      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>
</div>

<!-- ── MAIN PANEL ─────────────────────────────────────── -->
<div id="panel">
  <header>
    <div class="header-logo">AURA <span>Admin</span></div>
    <div class="header-actions">
      <a href="index.html" class="link-player">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Player
      </a>
      <button class="btn-logout" id="btn-logout">Sair</button>
    </div>
  </header>

  <main>

    <!-- Upload -->
    <section>
      <p class="section-title">Adicionar músicas</p>
      <div id="drop-zone">
        <div class="dz-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <p class="dz-text">Arrasta MP3s aqui ou clica para selecionar</p>
        <p class="dz-sub">Formato do nome: <code>Artista - Título.mp3</code> para preenchimento automático</p>
        <input type="file" id="file-input" multiple accept="audio/*" style="display:none">
      </div>

      <div id="upload-list"></div>
      <button id="btn-clear-list">Limpar lista de uploads</button>
    </section>

    <!-- Tracks table -->
    <section>
      <div class="tracks-header">
        <p class="section-title" style="margin-bottom:0">Faixas</p>
        <span id="track-count"></span>
      </div>
      <div class="table-wrap">
        <div id="table-loading">A carregar...</div>
        <table id="tracks-table" style="display:none">
          <thead>
            <tr>
              <th>Capa</th>
              <th>Título</th>
              <th>Artista</th>
              <th>Duração</th>
              <th>Ordem</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tracks-tbody"></tbody>
        </table>
      </div>
    </section>

  </main>
</div>

<script src="/api/config" onerror="window.SUPABASE_URL='';window.SUPABASE_ANON_KEY='';window.ADMIN_PASSWORD='';"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script>
// ─── Auth ────────────────────────────────────────────────────────────────────
const loginOverlay = document.getElementById('login-overlay');
const panel        = document.getElementById('panel');
const loginForm    = document.getElementById('login-form');
const pwInput      = document.getElementById('pw-input');
const pwError      = document.getElementById('pw-error');

function checkAuth() {
  if (sessionStorage.getItem('aura_authed') === '1') {
    loginOverlay.style.display = 'none';
    panel.classList.add('visible');
    initPanel();
  } else {
    loginOverlay.style.display = 'flex';
    panel.classList.remove('visible');
  }
}

loginForm.addEventListener('submit', e => {
  e.preventDefault();
  const pw = pwInput.value;
  if (!window.ADMIN_PASSWORD || ADMIN_PASSWORD === 'COLOCA_AQUI') {
    pwError.textContent = 'ADMIN_PASSWORD não configurado no config.js.';
    return;
  }
  if (pw === ADMIN_PASSWORD) {
    sessionStorage.setItem('aura_authed', '1');
    pwError.textContent = '';
    checkAuth();
  } else {
    pwError.textContent = 'Password incorreta.';
    pwInput.value = '';
    pwInput.focus();
  }
});

document.getElementById('btn-logout').addEventListener('click', () => {
  sessionStorage.removeItem('aura_authed');
  location.reload();
});

// ─── Supabase ────────────────────────────────────────────────────────────────
let db;

function initPanel() {
  if (!window.SUPABASE_URL || SUPABASE_URL === 'COLOCA_AQUI') {
    document.getElementById('table-loading').textContent = '⚠ config.js não configurado.';
    return;
  }
  try {
    db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    document.getElementById('table-loading').textContent = 'Erro ao inicializar Supabase: ' + e.message;
    return;
  }
  setupUpload();
  loadTracks();
}

// ─── Upload ──────────────────────────────────────────────────────────────────
const dropZone    = document.getElementById('drop-zone');
const fileInput   = document.getElementById('file-input');
const uploadList  = document.getElementById('upload-list');
const btnClear    = document.getElementById('btn-clear-list');

function setupUpload() {
  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });

  fileInput.addEventListener('change', () => {
    handleFiles(fileInput.files);
    fileInput.value = '';
  });

  btnClear.addEventListener('click', () => {
    uploadList.innerHTML = '';
    btnClear.classList.remove('visible');
  });
}

async function handleFiles(files) {
  const audioFiles = Array.from(files).filter(f => f.type.startsWith('audio/') || /\.(mp3|flac|wav|ogg|m4a|aac)$/i.test(f.name));
  if (audioFiles.length === 0) return;

  btnClear.classList.remove('visible');

  for (const file of audioFiles) {
    await processFile(file);
  }

  btnClear.classList.add('visible');
  await loadTracks();
}

async function processFile(file) {
  const item = createProgressItem(file.name);

  try {
    setStep(item, 'A preparar...', 10);

    const { artist, title } = parseFilename(file.name);
    const uuid = crypto.randomUUID();
    const safeFilename = file.name.replace(/[^\w.\-]/g, '_');

    setStep(item, 'A ler cover art...', 20);
    const coverBlob = await readCoverArt(file);

    setStep(item, 'A medir duração...', 30);
    const duration = await getDuration(file);

    setStep(item, 'A fazer upload do áudio...', 45);
    const audioPath = `audio/${uuid}-${safeFilename}`;
    const { error: audioErr } = await db.storage
      .from('music')
      .upload(audioPath, file, { contentType: file.type || 'audio/mpeg' });
    if (audioErr) throw audioErr;

    const { data: { publicUrl: audioUrl } } = db.storage.from('music').getPublicUrl(audioPath);

    let coverUrl = null;
    if (coverBlob) {
      setStep(item, 'A fazer upload da capa...', 65);
      const coverPath = `covers/${uuid}.jpg`;
      const { error: coverErr } = await db.storage
        .from('music')
        .upload(coverPath, coverBlob, { contentType: coverBlob.type || 'image/jpeg' });
      if (!coverErr) {
        const { data: { publicUrl } } = db.storage.from('music').getPublicUrl(coverPath);
        coverUrl = publicUrl;
      }
    }

    setStep(item, 'A guardar na base de dados...', 85);
    const maxPos = await getMaxPosition();

    const { error: insertErr } = await db.from('tracks').insert({
      title,
      artist,
      filename: file.name,
      storage_path: audioPath,
      public_url: audioUrl,
      duration,
      position: maxPos + 1,
      cover_url: coverUrl,
    });
    if (insertErr) throw insertErr;

    setStep(item, 'Concluído ✓', 100, 'success');
  } catch (err) {
    console.error(err);
    setStep(item, `Erro ✗: ${err.message || 'Falha no upload'}`, 100, 'error');
  }
}

function createProgressItem(filename) {
  const el = document.createElement('div');
  el.className = 'pi';
  el.innerHTML = `
    <div class="pi-top">
      <span class="pi-name">${esc(filename)}</span>
      <span class="pi-status">A iniciar...</span>
    </div>
    <div class="pi-bar-wrap"><div class="pi-bar"></div></div>
  `;
  uploadList.appendChild(el);
  return el;
}

function setStep(el, msg, pct, state = '') {
  el.querySelector('.pi-status').textContent = msg;
  el.querySelector('.pi-bar').style.width = pct + '%';
  if (state) el.className = `pi ${state}`;
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function parseFilename(filename) {
  const base = filename.replace(/\.[^.]+$/, '');
  const sep  = ' - ';
  const idx  = base.indexOf(sep);
  if (idx > 0) {
    return {
      artist: base.slice(0, idx).trim(),
      title:  base.slice(idx + sep.length).trim() || base,
    };
  }
  return { artist: 'Desconhecido', title: base };
}

function readCoverArt(file) {
  return new Promise(resolve => {
    try {
      window.jsmediatags.read(file, {
        onSuccess(tag) {
          const pic = tag.tags.picture;
          if (pic && pic.data && pic.data.length > 0) {
            resolve(new Blob([new Uint8Array(pic.data)], { type: pic.format || 'image/jpeg' }));
          } else {
            resolve(null);
          }
        },
        onError() { resolve(null); },
      });
    } catch { resolve(null); }
  });
}

function getDuration(file) {
  return new Promise(resolve => {
    const tmp = document.createElement('audio');
    const url = URL.createObjectURL(file);
    const cleanup = v => { URL.revokeObjectURL(url); resolve(v); };
    const timer = setTimeout(() => cleanup(null), 6000);
    tmp.addEventListener('loadedmetadata', () => {
      clearTimeout(timer);
      cleanup(isFinite(tmp.duration) ? Math.round(tmp.duration) : null);
    });
    tmp.addEventListener('error', () => { clearTimeout(timer); cleanup(null); });
    tmp.preload = 'metadata';
    tmp.src = url;
  });
}

async function getMaxPosition() {
  const { data } = await db
    .from('tracks')
    .select('position')
    .order('position', { ascending: false })
    .limit(1);
  return data && data.length > 0 ? (data[0].position ?? -1) : -1;
}

// ─── Tracks list ─────────────────────────────────────────────────────────────
async function loadTracks() {
  const loadingEl = document.getElementById('table-loading');
  const tableEl   = document.getElementById('tracks-table');
  loadingEl.style.display = 'block';
  tableEl.style.display   = 'none';

  if (!db) return;

  const { data, error } = await db
    .from('tracks')
    .select('*')
    .order('position', { ascending: true });

  loadingEl.style.display = 'none';
  tableEl.style.display   = 'table';

  if (error) {
    document.getElementById('tracks-tbody').innerHTML =
      `<tr class="empty-row"><td colspan="6">Erro ao carregar: ${esc(error.message)}</td></tr>`;
    return;
  }

  renderTracks(data || []);
}

function renderTracks(list) {
  const tbody = document.getElementById('tracks-tbody');
  const countEl = document.getElementById('track-count');
  countEl.textContent = list.length === 0 ? '' : `${list.length} faixa${list.length !== 1 ? 's' : ''}`;

  if (list.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">Sem faixas adicionadas ainda.</td></tr>`;
    return;
  }

  tbody.innerHTML = '';
  list.forEach((track, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="td-cover">
        ${track.cover_url
          ? `<img src="${esc(track.cover_url)}" class="track-thumb" alt="">`
          : `<div class="thumb-ph"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>`
        }
      </td>
      <td class="td-title">${esc(track.title)}</td>
      <td class="td-artist">${esc(track.artist)}</td>
      <td class="td-dur">${fmtDur(track.duration)}</td>
      <td class="td-order">
        <button class="btn-move btn-up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="btn-move btn-dn" ${i === list.length - 1 ? 'disabled' : ''}>↓</button>
      </td>
      <td class="td-del">
        <button class="btn-del">Apagar</button>
      </td>
    `;

    if (i > 0)
      tr.querySelector('.btn-up').addEventListener('click', () => moveTrack(list, i, i - 1));
    if (i < list.length - 1)
      tr.querySelector('.btn-dn').addEventListener('click', () => moveTrack(list, i, i + 1));
    tr.querySelector('.btn-del').addEventListener('click', () => deleteTrack(track));

    tbody.appendChild(tr);
  });
}

async function moveTrack(list, fromIdx, toIdx) {
  const a = list[fromIdx];
  const b = list[toIdx];
  // Swap positions in DB
  await db.from('tracks').update({ position: b.position }).eq('id', a.id);
  await db.from('tracks').update({ position: a.position }).eq('id', b.id);
  await loadTracks();
}

async function deleteTrack(track) {
  if (!confirm(`Apagar "${track.title}"?`)) return;
  try {
    // Remove audio from storage
    await db.storage.from('music').remove([track.storage_path]);
    // Remove cover from storage if present
    if (track.cover_url) {
      const coverPath = urlToStoragePath(track.cover_url);
      if (coverPath) await db.storage.from('music').remove([coverPath]);
    }
    // Delete row
    const { error } = await db.from('tracks').delete().eq('id', track.id);
    if (error) throw error;
    await loadTracks();
  } catch (err) {
    alert(`Erro ao apagar: ${err.message || err}`);
  }
}

function urlToStoragePath(url) {
  try {
    const u    = new URL(url);
    const parts = u.pathname.split('/');
    const idx  = parts.indexOf('public');
    if (idx < 0) return null;
    // parts[idx+1] = bucket name ('music'), parts[idx+2..] = path inside bucket
    return decodeURIComponent(parts.slice(idx + 2).join('/'));
  } catch { return null; }
}

// ─── Shared helpers ───────────────────────────────────────────────────────────
function fmtDur(s) {
  if (s == null || !isFinite(s)) return '—';
  const m  = Math.floor(s / 60);
  const ss = String(Math.floor(s % 60)).padStart(2, '0');
  return `${m}:${ss}`;
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = String(str ?? '');
  return d.innerHTML;
}

checkAuth();
