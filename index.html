<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Aura</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0a0a0f;
  --sidebar:   #0d0d14;
  --surface:   #12121a;
  --surface2:  #1a1a26;
  --surface3:  #22223080;
  --gold:      #c8a96e;
  --gold2:     #dfc089;
  --text:      #f0f0f0;
  --text2:     #b3b3b3;
  --muted:     #707070;
  --border:    rgba(200,169,110,0.1);
  --player-h:  90px;
  --sidebar-w: 240px;
}

html, body { height: 100%; }

body {
  font-family: 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: 1fr var(--player-h);
  grid-template-areas: "sidebar main" "player player";
  height: 100dvh;
  overflow: hidden;
}

/* ─── SCROLLBAR ──────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

/* ─── SIDEBAR ─────────────────────────────────────────────── */
#sidebar {
  grid-area: sidebar;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-brand {
  padding: 22px 20px 18px;
  flex-shrink: 0;
}

.brand-link {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.brand-icon {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.brand-name {
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.28em;
  color: var(--text);
}

.sidebar-lib-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px 10px;
  flex-shrink: 0;
}

.lib-label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-admin {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid var(--border);
  color: var(--muted);
  background: none;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 1rem;
  line-height: 1;
  transition: all 0.2s;
  flex-shrink: 0;
}
.btn-admin:hover {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(200,169,110,0.08);
}

#track-list {
  flex: 1;
  overflow-y: auto;
  padding: 2px 0 8px;
}

/* Sidebar track row */
.track-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  cursor: pointer;
  border-radius: 6px;
  margin: 0 8px;
  transition: background 0.15s;
  min-height: 52px;
  user-select: none;
}
.track-item:hover { background: rgba(255,255,255,0.05); }
.track-item.active { background: rgba(200,169,110,0.08); }

.ti-thumb {
  width: 36px;
  height: 36px;
  border-radius: 4px;
  flex-shrink: 0;
  overflow: hidden;
  background: var(--surface2);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ti-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ti-thumb-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.ti-thumb-ph svg { opacity: 0.25; }

/* Equalizer overlay on active thumb */
.ti-eq {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
  padding: 7px 8px 6px;
  opacity: 0;
  transition: opacity 0.2s;
}
body.playing .track-item.active .ti-eq { opacity: 1; }

.ti-eq span {
  display: block;
  width: 3px;
  border-radius: 2px 2px 0 0;
  background: var(--gold);
  animation: eq-bar 0.6s ease-in-out infinite alternate;
}
.ti-eq span:nth-child(1) { animation-duration: 0.55s; animation-delay: 0.00s; }
.ti-eq span:nth-child(2) { animation-duration: 0.72s; animation-delay: 0.12s; }
.ti-eq span:nth-child(3) { animation-duration: 0.88s; animation-delay: 0.05s; }
@keyframes eq-bar { from { height: 2px; } to { height: 18px; } }

.ti-info { flex: 1; min-width: 0; }
.ti-name {
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  line-height: 1.3;
}
.track-item.active .ti-name { color: var(--gold); }
.ti-artist {
  font-size: 0.7rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

.ti-dur {
  font-size: 0.65rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.state-msg {
  padding: 32px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 0.8rem;
  line-height: 1.8;
}
.state-msg a { color: var(--gold); text-decoration: none; }
.state-msg a:hover { text-decoration: underline; }

/* ─── TOP BAR (mobile only) ──────────────────────────────── */
.top-bar {
  grid-area: topbar;
  display: none;
  align-items: center;
  padding: 0 16px;
  height: 56px;
  background: var(--sidebar);
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

.btn-hamburger {
  background: none;
  border: none;
  color: var(--text2);
  cursor: pointer;
  padding: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.top-bar-brand {
  flex: 1;
  text-align: center;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--gold);
}

.top-bar-admin {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  color: var(--muted);
  background: none;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 1.1rem;
  flex-shrink: 0;
  transition: all 0.2s;
}
.top-bar-admin:hover { border-color: var(--gold); color: var(--gold); }

/* ─── MAIN CONTENT ───────────────────────────────────────── */
#main {
  grid-area: main;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
}

/* ─── HERO ───────────────────────────────────────────────── */
.main-hero {
  position: relative;
  padding: 48px 32px 40px;
  display: flex;
  align-items: flex-end;
  gap: 28px;
  min-height: 280px;
  flex-shrink: 0;
  overflow: hidden;
}

.hero-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(90px) saturate(1.5) brightness(0.6);
  transform: scale(1.4);
  opacity: 0;
  transition: opacity 1.2s ease, background-image 0.8s ease;
  z-index: 0;
}
.hero-bg.active { opacity: 1; }

.hero-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, var(--bg) 0%, rgba(10,10,15,0.3) 100%);
  z-index: 1;
}

.hero-cover {
  position: relative;
  z-index: 2;
  flex-shrink: 0;
}
.hero-img, .hero-ph {
  width: 180px;
  height: 180px;
  border-radius: 12px;
  box-shadow: 0 16px 56px rgba(0,0,0,0.7);
  display: block;
}
.hero-img { object-fit: cover; }
.hero-ph {
  background: linear-gradient(145deg, var(--surface2), var(--surface3));
  display: flex;
  align-items: center;
  justify-content: center;
}
.hero-ph svg { opacity: 0.18; }

.hero-info {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hero-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text2);
}
.hero-title {
  font-size: 2.6rem;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.05;
  color: var(--text);
  word-break: break-word;
}
.hero-artist {
  font-size: 0.95rem;
  color: var(--text2);
  margin-top: 4px;
}

/* Idle hero */
.hero-idle {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hero-idle-icon {
  width: 64px;
  height: 64px;
  border-radius: 14px;
  background: rgba(200,169,110,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 6px;
}
.hero-idle h1 {
  font-size: 2rem;
  font-weight: 700;
  color: var(--text);
}
.hero-idle p { font-size: 0.88rem; color: var(--muted); }

/* ─── TRACKS TABLE ───────────────────────────────────────── */
.tracks-section {
  padding: 28px 32px 32px;
  flex: 1;
}

.ts-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  padding: 0 16px 8px;
  border-bottom: 1px solid var(--border);
}
.ts-col-num   { width: 36px; text-align: right; }
.ts-col-info  { flex: 1; padding-left: 14px; }
.ts-col-artist{ width: 180px; padding: 0 16px; }
.ts-col-dur   { width: 52px; text-align: right; }
.ts-header span {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

#tracks-body { width: 100%; }

.track-row {
  display: flex;
  align-items: center;
  padding: 4px 16px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.12s;
  min-height: 56px;
  user-select: none;
  gap: 0;
}
.track-row:hover { background: rgba(255,255,255,0.04); }
.track-row.active { background: rgba(200,169,110,0.07); }

.tr-num {
  width: 36px;
  text-align: right;
  flex-shrink: 0;
  position: relative;
}
.tr-num-text {
  font-size: 0.82rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.track-row.active .tr-num-text { color: var(--gold); }

/* Small equalizer for active row */
.tr-eq {
  display: none;
  align-items: flex-end;
  gap: 1.5px;
  height: 14px;
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
}
body.playing .track-row.active .tr-eq { display: flex; }
body.playing .track-row.active .tr-num-text { display: none; }

.tr-eq span {
  display: block;
  width: 2.5px;
  border-radius: 2px 2px 0 0;
  background: var(--gold);
  animation: eq-bar 0.6s ease-in-out infinite alternate;
}
.tr-eq span:nth-child(1) { animation-duration: 0.55s; animation-delay: 0.00s; }
.tr-eq span:nth-child(2) { animation-duration: 0.70s; animation-delay: 0.10s; }
.tr-eq span:nth-child(3) { animation-duration: 0.85s; animation-delay: 0.05s; }

.tr-info {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  padding-left: 14px;
  min-width: 0;
}
.tr-cover {
  width: 40px;
  height: 40px;
  border-radius: 4px;
  flex-shrink: 0;
  overflow: hidden;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.tr-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tr-cover svg { opacity: 0.2; }

.tr-text { min-width: 0; }
.tr-title {
  font-size: 0.84rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  line-height: 1.3;
}
.track-row.active .tr-title { color: var(--gold); }
.tr-artist-small {
  font-size: 0.72rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
  display: none;
}

.tr-artist {
  width: 180px;
  font-size: 0.78rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 16px;
  flex-shrink: 0;
}
.tr-dur {
  width: 52px;
  text-align: right;
  font-size: 0.75rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

/* ─── TRACK CARDS (mobile) ───────────────────────────────── */
.tracks-cards {
  display: none;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 14px;
}

.track-card {
  background: var(--surface);
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
  transition: background 0.2s;
  user-select: none;
}
.track-card:hover { background: var(--surface2); }
.track-card.active { background: rgba(200,169,110,0.09); }

.tc-cover {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  position: relative;
}
.tc-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tc-cover svg { opacity: 0.2; }

.tc-eq {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
  padding: 0 30% 10px;
  opacity: 0;
  transition: opacity 0.2s;
}
body.playing .track-card.active .tc-eq { opacity: 1; }
.tc-eq span {
  display: block;
  width: 4px;
  border-radius: 2px 2px 0 0;
  background: var(--gold);
  animation: eq-bar 0.6s ease-in-out infinite alternate;
}
.tc-eq span:nth-child(1) { animation-duration: 0.55s; animation-delay: 0.00s; }
.tc-eq span:nth-child(2) { animation-duration: 0.72s; animation-delay: 0.10s; }
.tc-eq span:nth-child(3) { animation-duration: 0.88s; animation-delay: 0.05s; }

.tc-name {
  font-size: 0.82rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 4px;
}
.track-card.active .tc-name { color: var(--gold); }
.tc-artist {
  font-size: 0.72rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ─── PLAYER BAR ─────────────────────────────────────────── */
#player-bar {
  grid-area: player;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr minmax(280px, 40%) 1fr;
  align-items: center;
  padding: 0 16px;
  gap: 8px;
  position: relative;
}

/* Left: track info */
.pb-track {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.pb-cover {
  width: 50px;
  height: 50px;
  border-radius: 6px;
  flex-shrink: 0;
  overflow: hidden;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.pb-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pb-cover svg { opacity: 0.22; }

.pb-meta { min-width: 0; flex: 1; }
.pb-title {
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  line-height: 1.3;
}
.pb-artist {
  font-size: 0.7rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

/* Center: controls + progress */
.pb-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.pb-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.ctrl-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  padding: 7px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.18s, transform 0.1s;
}
.ctrl-btn:hover { color: var(--text); }
.ctrl-btn:active { transform: scale(0.88); }
.ctrl-btn.active { color: var(--gold); }

#btn-play {
  width: 34px;
  height: 34px;
  background: var(--text);
  color: var(--bg);
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s, background 0.2s;
  padding: 0;
}
#btn-play:hover { background: #fff; transform: scale(1.06); }

.pb-progress {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
}
.pb-time {
  font-size: 0.62rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  min-width: 30px;
  white-space: nowrap;
}
#pb-time-total { text-align: right; }

.progress-track {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  cursor: pointer;
  position: relative;
  transition: height 0.12s;
}
.progress-track:hover { height: 5px; }

.progress-fill {
  height: 100%;
  background: var(--text2);
  border-radius: 4px;
  width: 0%;
  position: relative;
  pointer-events: none;
  transition: background 0.2s;
}
.progress-track:hover .progress-fill { background: var(--gold); }
.progress-fill::after {
  content: '';
  position: absolute;
  right: -5px;
  top: 50%;
  transform: translateY(-50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff;
  opacity: 0;
  transition: opacity 0.12s;
}
.progress-track:hover .progress-fill::after { opacity: 1; }

/* Right: volume */
.pb-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

.vol-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  display: flex;
  align-items: center;
  padding: 4px;
  transition: color 0.18s;
}
.vol-btn:hover { color: var(--text); }

#vol-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 80px;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  outline: none;
  cursor: pointer;
}
#vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text);
  cursor: pointer;
}
#vol-slider:hover::-webkit-slider-thumb { background: #fff; }
#vol-slider::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text);
  border: none;
  cursor: pointer;
}

/* Mobile play button on player bar */
.pb-mobile-btn {
  display: none;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}
.pb-mobile-play {
  width: 36px;
  height: 36px;
  background: var(--text);
  color: var(--bg);
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s;
}
.pb-mobile-play:hover { transform: scale(1.06); }

/* Tap overlay to open modal on mobile */
.pb-tap {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 1;
  cursor: pointer;
}

/* ─── MOBILE NOW PLAYING MODAL ───────────────────────────── */
#np-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  flex-direction: column;
  align-items: center;
  padding: 0;
  overflow: hidden;
}
#np-modal.open { display: flex; }

.npm-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 10px;
  flex-shrink: 0;
}
.npm-close {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 8px;
  display: flex;
  align-items: center;
}
.npm-label {

  volHi:   `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`,

// ─── Init ────────────────────────────────────────────────────────────────────
function init() {
  // Set icons
  btnPlay.innerHTML       = IC.play;
  btnPrev.innerHTML       = IC.prev;
  btnNext.innerHTML       = IC.next;
  btnShuffle.innerHTML    = IC.shuffle;
  btnRepeat.innerHTML     = IC.repeat;
  btnPlayMobile.innerHTML = IC.play;
  npmPlay.innerHTML       = IC.playLg;
  npmShuffle.innerHTML    = IC.shuffle;
  npmPrev.innerHTML       = IC.prev;
  npmNext.innerHTML       = IC.next;
  npmRepeat.innerHTML     = IC.repeat;

  audio.volume    = 0.8;
  volSlider.value = 0.8;
  npmVolSlider.value = 0.8;
  updateVolIcon();

    trackListEl.innerHTML = `<div class="state-msg">⚠ Configura as credenciais do Supabase.</div>`;
    return;
  }
  try {
    window._db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    trackListEl.innerHTML = `<div class="state-msg">Erro Supabase: ${esc(e.message)}</div>`;
    return;
  }
  loadTracks();
}

// ─── Data ────────────────────────────────────────────────────────────────────
async function loadTracks() {
  trackListEl.innerHTML = '<div class="state-msg">A carregar...</div>';
  const { data, error } = await window._db
    .from('tracks').select('*').order('position', { ascending: true });

  if (error) {
    trackListEl.innerHTML = `<div class="state-msg">Erro ao carregar.<br><small>${esc(error.message)}</small></div>`;
    return;
  }
  tracks = data || [];
  renderAll();
}

function renderAll() {
  renderSidebar();
  renderTable();
  renderCards();
}

// ─── Sidebar list ─────────────────────────────────────────────────────────────

  if (tracks.length === 0) {
    trackListEl.innerHTML = `<div class="state-msg">Sem músicas.<br><a href="admin.html">Adicionar no Admin →</a></div>`;
    return;
  }
  trackListEl.innerHTML = '';
  tracks.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'track-item' + (i === currentIdx ? ' active' : '');
    el.innerHTML = `
      <div class="ti-thumb">
        ${t.cover_url
          ? `<img src="${esc(t.cover_url)}" alt="" loading="lazy">`
          : `<div class="ti-thumb-ph">${IC.noteSm}</div>`}
        <div class="ti-eq"><span></span><span></span><span></span></div>
      </div>
      <div class="ti-info">
        <div class="ti-name">${esc(t.title)}</div>
        <div class="ti-artist">${esc(t.artist)}</div>
      </div>
      <span class="ti-dur">${fmtDur(t.duration)}</span>
    `;
    el.addEventListener('click', () => { loadAndPlay(i); closeSidebar(); });
    trackListEl.appendChild(el);
  });
}

// ─── Desktop table ────────────────────────────────────────────────────────────
function renderTable() {
  if (tracks.length === 0) {
    tracksBody.innerHTML = '';
    return;
  }
  tracksBody.innerHTML = '';
  tracks.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'track-row' + (i === currentIdx ? ' active' : '');
    el.innerHTML = `
      <div class="tr-num">
        <span class="tr-num-text">${i + 1}</span>
        <div class="tr-eq"><span></span><span></span><span></span></div>
      </div>
      <div class="tr-info">
        <div class="tr-cover">
          ${t.cover_url
            ? `<img src="${esc(t.cover_url)}" alt="" loading="lazy">`
            : IC.noteSm}
        </div>
        <div class="tr-text">
          <div class="tr-title">${esc(t.title)}</div>
          <div class="tr-artist-small">${esc(t.artist)}</div>
        </div>
      </div>
      <div class="tr-artist">${esc(t.artist)}</div>
      <div class="tr-dur">${fmtDur(t.duration)}</div>
    `;
    el.addEventListener('click', () => loadAndPlay(i));
    tracksBody.appendChild(el);
  });
}

// ─── Mobile cards ─────────────────────────────────────────────────────────────
function renderCards() {
  if (tracks.length === 0) {
    tracksCards.innerHTML = '';
    return;
  }
  tracksCards.innerHTML = '';
  tracks.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'track-card' + (i === currentIdx ? ' active' : '');
    el.innerHTML = `
      <div class="tc-cover">
        ${t.cover_url
          ? `<img src="${esc(t.cover_url)}" alt="" loading="lazy">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">${IC.note}</div>`}
        <div class="tc-eq"><span></span><span></span><span></span></div>
      </div>
      <div class="tc-name">${esc(t.title)}</div>
      <div class="tc-artist">${esc(t.artist)}</div>
    `;
    el.addEventListener('click', () => loadAndPlay(i));
    tracksCards.appendChild(el);
  });
}

// ─── Playback ─────────────────────────────────────────────────────────────────
function loadAndPlay(idx) {
  if (idx < 0 || idx >= tracks.length) return;
  currentIdx = idx;
  const t = tracks[idx];

  audio.src = t.public_url;
  audio.play().catch(() => {});

  updateHero(t);
  updatePlayerBar(t);
  renderAll();
  setPlayState(true);
}

function updateHero(t) {
  heroIdle.style.display      = 'none';
  heroCoverWrap.style.display = 'block';
  heroInfo.style.display      = 'flex';

  if (t.cover_url) {
    heroImg.src          = t.cover_url;
    heroImg.style.display = 'block';
    heroPh.style.display  = 'none';
    heroBg.style.backgroundImage = `url("${t.cover_url}")`;
    heroBg.classList.add('active');
  } else {
    heroImg.style.display = 'none';
    heroPh.style.display  = 'flex';
    heroBg.classList.remove('active');
  }
  heroTitle.textContent  = t.title;
  heroArtist.textContent = t.artist;
}

function updatePlayerBar(t) {
  pbTitle.textContent  = t.title;
  pbArtist.textContent = t.artist;

  // Player bar cover
  pbCover.innerHTML = t.cover_url
    ? `<img src="${esc(t.cover_url)}" alt="">`
    : IC.note;

  // Modal
  npmTitle.textContent  = t.title;
  npmArtist.textContent = t.artist;
  npmCover.innerHTML = t.cover_url
    ? `<img src="${esc(t.cover_url)}" alt="">`
    : IC.note;

  if (t.cover_url) {
    npmBg.style.backgroundImage = `url("${t.cover_url}")`;
    npmBg.classList.add('active');
  } else {
    npmBg.classList.remove('active');
  }
}

function setPlayState(playing) {
  document.body.classList.toggle('playing', playing);
  btnPlay.innerHTML       = playing ? IC.pause   : IC.play;
  btnPlayMobile.innerHTML = playing ? IC.pause   : IC.play;
  npmPlay.innerHTML       = playing ? IC.pauseLg : IC.playLg;
}

function getNextIdx() {
  if (shuffleOn) {
    if (shuffleQueue.length === 0) refillShuffle();
    return shuffleQueue.length > 0 ? shuffleQueue.pop() : (currentIdx + 1) % tracks.length;
  }
  return (currentIdx + 1) % tracks.length;
}

function getPrevIdx() {
  return currentIdx <= 0 ? tracks.length - 1 : currentIdx - 1;
}

function refillShuffle() {
  const arr = Array.from({ length: tracks.length }, (_, i) => i).filter(i => i !== currentIdx);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  shuffleQueue = arr;
}

function toggleShuffle() {
  shuffleOn = !shuffleOn;
  if (shuffleOn) refillShuffle();
  btnShuffle.classList.toggle('active', shuffleOn);
  npmShuffle.classList.toggle('active', shuffleOn);
}

function cycleRepeat() {
  repeatMode = (repeatMode + 1) % 3;
  const icon = repeatMode === 1 ? IC.repeat1 : IC.repeat;
  btnRepeat.innerHTML = icon;
  npmRepeat.innerHTML = icon;
  btnRepeat.classList.toggle('active', repeatMode > 0);
  npmRepeat.classList.toggle('active', repeatMode > 0);
}

// ─── Control events ───────────────────────────────────────────────────────────
function playPause() {
  if (tracks.length === 0) return;
  if (currentIdx === -1) { loadAndPlay(0); return; }
  if (audio.paused) { audio.play().catch(() => {}); setPlayState(true); }
  else              { audio.pause(); setPlayState(false); }
}

btnPlay.addEventListener('click',       playPause);
btnPlayMobile.addEventListener('click', playPause);
npmPlay.addEventListener('click',       playPause);

btnPrev.addEventListener('click', prevTrack);
npmPrev.addEventListener('click', prevTrack);
function prevTrack() {
  if (!tracks.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  loadAndPlay(getPrevIdx());
}

btnNext.addEventListener('click', nextTrack);
npmNext.addEventListener('click', nextTrack);
function nextTrack() {
  if (!tracks.length) return;
  loadAndPlay(getNextIdx());
}

btnShuffle.addEventListener('click', toggleShuffle);
npmShuffle.addEventListener('click', toggleShuffle);

btnRepeat.addEventListener('click', cycleRepeat);
npmRepeat.addEventListener('click', cycleRepeat);

// ─── Audio events ─────────────────────────────────────────────────────────────
audio.addEventListener('ended', () => {
  if (repeatMode === 1) { audio.currentTime = 0; audio.play(); return; }
  if (shuffleOn || repeatMode === 2) { loadAndPlay(getNextIdx()); return; }
  if (currentIdx < tracks.length - 1) loadAndPlay(currentIdx + 1);
  else { setPlayState(false); audio.currentTime = 0; updateBars(0); }
});

audio.addEventListener('timeupdate', () => {
  if (!audio.duration || !isFinite(audio.duration)) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  updateBars(pct);
  const cur = fmtDur(audio.currentTime);
  const tot = fmtDur(audio.duration);
  pbTimeCur.textContent  = cur;
  pbTimeTot.textContent  = tot;
  npmTimeCur.textContent = cur;
  npmTimeTot.textContent = tot;
});

function updateBars(pct) {
  progressFill.style.width  = pct + '%';
  npmProgressFl.style.width = pct + '%';
}

audio.addEventListener('play',  () => setPlayState(true));
audio.addEventListener('pause', () => setPlayState(false));

// ─── Progress scrubber ────────────────────────────────────────────────────────
function seek(e, trackEl) {
  if (!audio.duration || !isFinite(audio.duration)) return;
  const rect = trackEl.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

progressTrack.addEventListener('click',    e => seek(e, progressTrack));
npmProgressTk.addEventListener('click',    e => seek(e, npmProgressTk));

// ─── Volume ───────────────────────────────────────────────────────────────────
function setVolume(v) {
  audio.volume = v;
  volSlider.value    = v;
  npmVolSlider.value = v;
  if (v > 0) prevVol = v;
  updateVolIcon();
}

volSlider.addEventListener('input',    () => setVolume(parseFloat(volSlider.value)));
npmVolSlider.addEventListener('input', () => setVolume(parseFloat(npmVolSlider.value)));

function toggleMute() {
  if (audio.volume > 0) { prevVol = audio.volume; setVolume(0); }
  else { setVolume(prevVol || 0.8); }
}
btnVol.addEventListener('click',    toggleMute);
npmBtnVol.addEventListener('click', toggleMute);

function updateVolIcon() {
  const ic = audio.volume === 0 ? IC.volMute : audio.volume < 0.5 ? IC.volLo : IC.volHi;
  btnVol.innerHTML    = ic;
  npmBtnVol.innerHTML = ic;
}

// ─── Mobile modal ─────────────────────────────────────────────────────────────
document.getElementById('pb-tap').addEventListener('click', () => {
  npmModal.classList.add('open');
  document.body.style.overflow = 'hidden';
});
npmClose.addEventListener('click', closeModal);

function closeModal() {
  npmModal.classList.remove('open');
  document.body.style.overflow = '';
}

// ─── Mobile sidebar ───────────────────────────────────────────────────────────
btnHamburger.addEventListener('click', () => {
  sidebar.classList.add('open');
  sidebarOverlay.classList.add('open');
});
sidebarOverlay.addEventListener('click', closeSidebar);
function closeSidebar() {
  sidebar.classList.remove('open');
  sidebarOverlay.classList.remove('open');
}

// ─── Keyboard ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch (e.key) {
    case ' ':
      e.preventDefault(); playPause(); break;
    case 'ArrowLeft':
      e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 5); break;
    case 'ArrowRight':
      e.preventDefault();
      if (isFinite(audio.duration)) audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      break;
    case 'ArrowUp':
      e.preventDefault(); setVolume(Math.min(1, +(audio.volume + 0.1).toFixed(2))); break;
    case 'ArrowDown':
      e.preventDefault(); setVolume(Math.max(0, +(audio.volume - 0.1).toFixed(2))); break;
  }
});

// ─── Helpers ──────────────────────────────────────────────────────────────────
function fmtDur(s) {
  if (s == null || !isFinite(s)) return '—';
  const m  = Math.floor(s / 60);
  const ss = String(Math.floor(s % 60)).padStart(2, '0');
  return `${m}:${ss}`;
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = String(str ?? '');
  return d.innerHTML;
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
fetch('/api/config')
  .then(r => r.json())
  .then(cfg => {
    window.SUPABASE_URL      = cfg.SUPABASE_URL;
    window.SUPABASE_ANON_KEY = cfg.SUPABASE_ANON_KEY;
    window.ADMIN_PASSWORD    = cfg.ADMIN_PASSWORD;
  })
  .catch(() => {})
  .finally(() => init());
</script>
</body>
